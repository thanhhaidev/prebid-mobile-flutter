name: prebid_mobile_sdk
description: "Unofficial Flutter plugin for the Prebid Mobile SDK 3.4: banner, interstitial, rewarded, native, multiformat and in-stream ads, targeting and privacy."
version: 1.0.0
homepage: https://github.com/thanhhaidev/prebid-mobile-flutter
repository: https://github.com/thanhhaidev/prebid-mobile-flutter
issue_tracker: https://github.com/thanhhaidev/prebid-mobile-flutter/issues
documentation: https://thanhhaidev.github.io/prebid-mobile-flutter/

topics:
  - ads
  - prebid
  - advertising
  - header-bidding
  - monetization

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Imported by the Pigeon-generated lib/src/generated/prebid_api.g.dart.
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned: CI regenerates the Pigeon API and fails on drift.
  pigeon: 29.0.8
  mockito: ^5.8.1
  build_runner: ^2.16.2

flutter:
  plugin:
    platforms:
      android:
        package: io.github.thanhhaidev.prebid_mobile_sdk
        pluginClass: PrebidMobileSdkPlugin
      ios:
        pluginClass: PrebidMobileSdkPlugin
