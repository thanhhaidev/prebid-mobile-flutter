name: prebid_mobile_sdk_max
description: "Unofficial AppLovin MAX mediation for prebid_mobile_sdk, via Prebid's MAX adapters. Optional companion package."
version: 1.0.0
homepage: https://github.com/thanhhaidev/prebid-mobile-flutter
repository: https://github.com/thanhhaidev/prebid-mobile-flutter
issue_tracker: https://github.com/thanhhaidev/prebid-mobile-flutter/issues
documentation: https://thanhhaidev.github.io/prebid-mobile-flutter/docs/max

topics:
  - ads
  - prebid
  - applovin-max
  - mediation
  - header-bidding

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.5'

dependencies:
  flutter:
    sdk: flutter
  # Core Prebid plugin. Inside the pub workspace this resolves to the local
  # packages/prebid_mobile_sdk.
  prebid_mobile_sdk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.prebid.prebid_mobile_sdk_max
        pluginClass: PrebidMobileSdkMaxPlugin
      ios:
        pluginClass: PrebidMobileSdkMaxPlugin
