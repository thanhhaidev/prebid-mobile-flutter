name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the running check; main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The melos config (root pubspec.yaml) points sdkPath at the local FVM SDK;
  # use the Flutter on PATH.
  MELOS_SDK_PATH: auto

jobs:
  check:
    name: Format, codegen, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      - name: Verify formatting
        run: dart run melos run format:check

      - name: Verify Pigeon output is up to date
        run: dart run melos run generate:check

      # Node ships with the runner; the script has no dependencies.
      - name: Verify native SDK version tables
        run: dart run melos run compatibility:check

      - name: Analyze all packages
        run: dart run melos run analyze

      - name: Run tests
        run: dart run melos run test

  publish-check:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      - name: Validate every publishable package
        run: dart run melos run publish:check

  score:
    name: pub.dev score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      # pana, the pub.dev scorer; companions are scored against the core in
      # this checkout through a local pub server (tool/score.sh).
      - name: Score every package (160/160 required)
        run: dart run melos run score

  android:
    name: Build example (Android)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Verify Kotlin formatting
        run: tool/format_native.sh --check kotlin

      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

      # The example includes every plugin as a Gradle subproject.
      - name: Plugin unit tests (JVM)
        working-directory: example/android
        run: >-
          ./gradlew --console=plain
          :prebid_mobile_sdk:testDebugUnitTest
          :prebid_mobile_sdk_gam:testDebugUnitTest
          :prebid_mobile_sdk_admob:testDebugUnitTest
          :prebid_mobile_sdk_max:testDebugUnitTest

      # R8 runs only in release builds: catches missing consumer keep rules.
      - name: Build release APK (R8)
        working-directory: example
        run: flutter build apk --release

  ios:
    name: Build example (iOS)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Verify Swift formatting
        run: |
          xcrun swift-format --version
          tool/format_native.sh --check swift

      - name: Build iOS (no codesign)
        working-directory: example
        run: flutter build ios --no-codesign --debug

      # example/ios/RunnerTests: the native conversions of the core plugin and
      # the companions, through `@testable import` of the plugin pods (the
      # example builds with CocoaPods; see its pubspec). On the first iPhone
      # simulator the runner image has.
      - name: Plugin unit tests (iOS simulator)
        working-directory: example/ios
        shell: bash
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | contains(".iOS-"))
              | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          [ -n "$udid" ] || { echo "::error::No iPhone simulator available"; exit 1; }
          xcodebuild test -quiet -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$udid"

  # One check to require in branch protection: green only when every job
  # above passed.
  ci:
    name: CI passed
    if: always()
    needs: [check, publish-check, score, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
