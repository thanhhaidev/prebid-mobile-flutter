name: prebid_mobile_sdk_max
description: "AppLovin MAX mediation for the Prebid Mobile Flutter SDK, via Prebid's MAX adapters. Optional companion to prebid_mobile_sdk."
version: 0.0.1
homepage: https://github.com/thanhhaidev/prebid-mobile-flutter
repository: https://github.com/thanhhaidev/prebid-mobile-flutter
issue_tracker: https://github.com/thanhhaidev/prebid-mobile-flutter/issues

topics:
  - ads
  - prebid
  - applovin-max
  - mediation
  - header-bidding

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.5'

dependencies:
  flutter:
    sdk: flutter
  # Core Prebid plugin. Inside the pub workspace this resolves to the local
  # packages/prebid_mobile_sdk.
  prebid_mobile_sdk: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.prebid.prebid_mobile_sdk_max
        pluginClass: PrebidMobileSdkMaxPlugin
      ios:
        pluginClass: PrebidMobileSdkMaxPlugin
