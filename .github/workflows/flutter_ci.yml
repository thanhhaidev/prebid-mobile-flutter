name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the running check; main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The melos config (root pubspec.yaml) points sdkPath at the local FVM SDK;
  # use the Flutter on PATH.
  MELOS_SDK_PATH: auto

jobs:
  check:
    name: Format, codegen, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      - name: Verify formatting
        run: dart run melos run format:check

      - name: Verify Pigeon output is up to date
        run: dart run melos run generate:check

      - name: Analyze all packages
        run: dart run melos run analyze

      - name: Run tests
        run: dart run melos run test

  publish-check:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      - name: Validate every publishable package
        run: dart run melos run publish:check

  android:
    name: Build example (Android)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build example (iOS)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Build iOS (no codesign)
        working-directory: example
        run: flutter build ios --no-codesign --debug
