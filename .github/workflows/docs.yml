name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/pubspec.yaml'
      - 'packages/*/android/build.gradle.kts'
      - 'packages/*/ios/*.podspec'
      - 'packages/*/ios/*/Package.swift'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
  workflow_dispatch:
  # After a release, so the changelog shows the new tag's date and pub.dev
  # link. Runs on main, which the github-pages environment accepts.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds get their own group per PR; deploys share one and are never
# cancelled halfway (a PR build used to cancel a running deploy).
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Skip when the release failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags give the changelog its release dates
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm run build` first regenerates the changelog and checks the
      # compatibility tables (prebuild).
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
