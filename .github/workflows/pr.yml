name: Pull request

# Checks the PR itself (not its code), so it runs with pull_request_target:
# labels can be written on PRs from forks. Nothing here checks out or runs
# the PR's code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit message, so it follows
      # Conventional Commits like the rest of the history.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the subject "{subject}" with a lowercase letter, e.g.
            "fix(native): report onAdExpired on iOS".

  label:
    name: Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
