name: prebid_mobile_sdk_admob
description: "Unofficial Google AdMob mediation for prebid_mobile_sdk, via Prebid's AdMob adapters. Optional companion package."
version: 1.0.0
homepage: https://github.com/thanhhaidev/prebid-mobile-flutter
repository: https://github.com/thanhhaidev/prebid-mobile-flutter
issue_tracker: https://github.com/thanhhaidev/prebid-mobile-flutter/issues
documentation: https://thanhhaidev.github.io/prebid-mobile-flutter/docs/admob

topics:
  - ads
  - prebid
  - admob
  - mediation
  - header-bidding

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Core Prebid plugin. Inside the pub workspace this resolves to the local
  # packages/prebid_mobile_sdk.
  prebid_mobile_sdk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.prebid.prebid_mobile_sdk_admob
        pluginClass: PrebidMobileSdkAdmobPlugin
      ios:
        pluginClass: PrebidMobileSdkAdmobPlugin
