name: prebid_mobile_sdk_gam
description: "Google Ad Manager (GAM) rendering for the Prebid Mobile Flutter SDK, via Prebid's GAM event handlers. Optional companion to prebid_mobile_sdk."
version: 0.0.1
homepage: https://github.com/thanhhaidev/prebid-mobile-flutter
repository: https://github.com/thanhhaidev/prebid-mobile-flutter
issue_tracker: https://github.com/thanhhaidev/prebid-mobile-flutter/issues

topics:
  - ads
  - prebid
  - gam
  - google-ad-manager
  - header-bidding

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.5'

dependencies:
  flutter:
    sdk: flutter
  # Core Prebid plugin. Path dependency for monorepo development; switch to a
  # hosted version constraint (prebid_mobile_sdk: ^x.y.z) before publishing.
  prebid_mobile_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.prebid.prebid_mobile_sdk_gam
        pluginClass: PrebidMobileSdkGamPlugin
      ios:
        pluginClass: PrebidMobileSdkGamPlugin
