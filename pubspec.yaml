# Pub workspace root for the Prebid Mobile Flutter monorepo.
# A single `flutter pub get` here resolves every member package below.
# Task orchestration (analyze, test, versioning) is handled by Melos,
# configured under the `melos` key below.
name: prebid_mobile_flutter_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/prebid_mobile_sdk
  - packages/prebid_mobile_sdk_gam
  - packages/prebid_mobile_sdk_admob
  - packages/prebid_mobile_sdk_max
  - example

dev_dependencies:
  melos: ^8.9.0

melos:
  # Local development uses the FVM-pinned SDK (.fvmrc). CI sets
  # MELOS_SDK_PATH=auto to use the Flutter on PATH instead.
  sdkPath: .fvm/flutter_sdk

  scripts:
    analyze:
      description: Analyze all packages.
      # One at a time: parallel `flutter` commands fight over the startup lock.
      run: dart run melos exec --concurrency=1 -- flutter analyze --no-pub

    test:
      description: Run tests in packages that have a test/ directory.
      run: dart run melos exec --concurrency=1 --dir-exists="test" -- flutter test --no-pub

    format:
      description: Format all Dart code.
      run: dart format .

    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --output=none --set-exit-if-changed .

    generate:
      description: Regenerate the Pigeon API (and format it) in prebid_mobile_sdk.
      run: >-
        cd packages/prebid_mobile_sdk &&
        dart run pigeon --input pigeons/prebid_api.dart &&
        dart format lib/src/generated

    generate:check:
      description: Fail if the committed Pigeon output is out of date.
      run: >-
        dart run melos run generate &&
        git diff --exit-code --
        'packages/prebid_mobile_sdk/*.g.dart'
        'packages/prebid_mobile_sdk/*.g.kt'
        'packages/prebid_mobile_sdk/*.g.swift'

    publish:check:
      description: pub publish --dry-run for every publishable package.
      run: dart run melos exec --concurrency=1 --no-private -- flutter pub publish --dry-run

    compatibility:
      description: Regenerate the README native-version tables from website/src/data/compatibility.json.
      run: node website/scripts/sync-compatibility.mjs

    compatibility:check:
      description: Fail if a README table is stale or compatibility.json disagrees with the build files.
      run: node website/scripts/sync-compatibility.mjs --check
